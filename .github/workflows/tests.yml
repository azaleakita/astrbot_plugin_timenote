name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sdk-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        astrbot: ['4.28.2', '4.29.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "astrbot==${{ matrix.astrbot }}" "mcp<2" -r requirements.txt ruff
      - run: ruff check .
      - run: python -m unittest -v test_timenote
      - run: git archive --format=zip --prefix=astrbot_plugin_timenote/ --output="$RUNNER_TEMP/timenote.zip" HEAD
      - run: python verify_install.py "$RUNNER_TEMP/timenote.zip"
